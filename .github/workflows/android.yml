name: Android
on:
  push:
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'shared/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.1.13356709' 'cmake;4.1.2'
      - run: bash ./gradlew --no-daemon :content-model:test :content-local:test :game-core:test :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: foxdroid-a0-debug
          path: android/app/build/outputs/apk/debug/*.apk
