<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>FoxDroid</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL RHYTHM LIBRARY</p>
        <h1>FoxDroid</h1>
        <p id="server-status" class="muted">正在连接内容服务…</p>
      </div>
      <button id="refresh" class="secondary" type="button">重新扫描</button>
    </header>

    <main>
      <section id="library-view">
        <div class="section-heading">
          <div><p class="eyebrow">LIBRARY</p><h2>选择歌曲</h2></div>
          <input id="search" type="search" placeholder="搜索标题或作者" autocomplete="off" />
        </div>
        <p id="library-message" class="notice" hidden></p>
        <ul id="songs" class="song-grid" aria-live="polite"></ul>
      </section>

      <section id="song-view" hidden>
        <button id="back" class="link-button" type="button">← 返回曲库</button>
        <div class="song-header">
          <div><p id="song-group" class="eyebrow"></p><h2 id="song-title"></h2><p id="song-artist" class="muted"></p></div>
          <button id="start" type="button" disabled>准备并开始</button>
        </div>
        <label class="field">谱面<select id="chart-select"></select></label>
        <details class="calibration-panel">
          <summary>本机校准</summary>
          <p class="muted">设置只保存在此浏览器。判定偏移为正时会把晚到的输入向前校正；视觉偏移只提前或延后谱面显示。</p>
          <label class="calibration-field">
            <span>判定偏移 <output id="input-offset-value" for="input-offset">0 ms</output></span>
            <input id="input-offset" type="range" min="-250" max="250" step="1" value="0" />
          </label>
          <label class="calibration-field">
            <span>视觉偏移 <output id="visual-offset-value" for="visual-offset">0 ms</output></span>
            <input id="visual-offset" type="range" min="-250" max="250" step="1" value="0" />
          </label>
          <button id="reset-calibration" class="secondary" type="button">恢复为零</button>
        </details>
        <p id="prepare-status" class="notice">选择谱面后，所有游戏数据会在开始前加载到浏览器。</p>
        <div class="capabilities">
          <span>键位 D F J K</span><span>浏览器本地时钟</span><span id="audio-capability">检测音频…</span>
        </div>
      </section>

      <section id="game-view" hidden>
        <div class="game-layout">
          <canvas id="stage" width="480" height="640" aria-label="四轨谱面"></canvas>
          <aside class="score-panel">
            <p class="eyebrow">NOW PLAYING</p><h2 id="playing-title"></h2>
            <div id="judgment" class="judgment">READY</div>
            <dl><div><dt>分数</dt><dd id="score">0</dd></div><div><dt>连击</dt><dd id="combo">0</dd></div><div><dt>准确率</dt><dd id="accuracy">100.00%</dd></div></dl>
            <p class="key-help"><kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd></p>
            <button id="quit" class="secondary" type="button">退出本局</button>
          </aside>
        </div>
      </section>

      <section id="result-view" hidden>
        <p class="eyebrow">RESULT</p><h2>本局完成</h2>
        <div id="result-stats" class="result-grid"></div>
        <button id="result-back" type="button">返回选歌</button>
      </section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
